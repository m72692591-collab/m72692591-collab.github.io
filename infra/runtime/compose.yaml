name: maestro-pilot
services:
  web:
    build:
      context: ../..
      dockerfile: infra/runtime/web.Dockerfile
    ports: ['127.0.0.1:8082:8080']
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 100
    depends_on: [api]
    networks: [edge, backend]
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  api:
    build:
      context: ../..
      dockerfile: infra/runtime/api.Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:rw,size=32m,mode=1777', '/usr/local/var/run:rw,size=1m,uid=82,gid=82']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    pids_limit: 60
    environment:
      MAESTRO_ALLOWED_ORIGIN: ${MAESTRO_ORIGIN:?Set approved HTTPS origin}
      MAESTRO_DB_DSN: mysql:host=db;dbname=maestro;charset=utf8mb4
      MAESTRO_DB_USER: maestro
    secrets: [db_password, admin_token, ip_pepper]
    networks: [backend]
    depends_on:
      db: {condition: service_healthy}
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: maestro
      MYSQL_USER: maestro
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    volumes:
      - maestro-data:/var/lib/mysql
      - ../../maestro/server/lead_schema.sql:/docker-entrypoint-initdb.d/001.sql:ro
    networks: [backend]
    mem_limit: 768m
    pids_limit: 150
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 4s
      retries: 30
    logging: {driver: json-file, options: {max-size: 5m, max-file: '2'}}
secrets:
  db_password: {file: '${MAESTRO_SECRET_DIR:?Set private directory}/db_password'}
  db_root_password: {file: '${MAESTRO_SECRET_DIR:?Set private directory}/db_root_password'}
  admin_token: {file: '${MAESTRO_SECRET_DIR:?Set private directory}/admin_token'}
  ip_pepper: {file: '${MAESTRO_SECRET_DIR:?Set private directory}/ip_pepper'}
networks:
  edge: {}
  backend: {internal: true}
volumes:
  maestro-data: {}
