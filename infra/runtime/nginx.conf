limit_req_zone $binary_remote_addr zone=maestro_submit:1m rate=10r/m;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  access_log off;
  error_log /dev/stderr warn;
  client_max_body_size 64k;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=()" always;
  location = /healthz { default_type application/json; return 200 '{"status":"web_ready","receiver_enabled":true}\n'; }
  location = / { return 302 /maestro/; }
  location = /api/leads {
    limit_req zone=maestro_submit burst=10 nodelay;
    limit_req_status 429;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /srv/receiver.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
    fastcgi_pass api:9000;
    fastcgi_read_timeout 25s;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;
  }
  location ~ (^|/)\. { return 404; }
  location ~* \.(php|sql|env|md|py|yml|yaml|map)$ { return 404; }
  location ~ ^/maestro/(server|admin)(/|$) { return 404; }
  location = /maestro/index.html { add_header Cache-Control 'no-cache'; try_files $uri =404; }
  location /maestro/ { try_files $uri $uri/ =404; }
  location / { return 404; }
}
# Reverse-proxy deployment gate: install exact trusted-proxy real_ip configuration
# only after its topology is known. Never trust an arbitrary visitor X-Forwarded-For.
# Until then the conservative per-address limits may group visitors behind a gateway.
