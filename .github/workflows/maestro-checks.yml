name: MAESTRO smoke checks
on:
  pull_request:
    paths:
      - 'maestro/**'
      - 'tests/maestro-smoke.mjs'
      - 'tests/maestro-browser.mjs'
      - 'tests/maestro-leads-api.mjs'
      - 'tests/maestro-speech.mjs'
      - 'tests/architect-rig.mjs'
      - 'tests/architect-portrait.mjs'
      - '.github/workflows/maestro-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'maestro/**'
      - 'tests/maestro-smoke.mjs'
      - 'tests/maestro-browser.mjs'
      - 'tests/maestro-leads-api.mjs'
      - 'tests/maestro-speech.mjs'
      - 'tests/architect-rig.mjs'
      - 'tests/architect-portrait.mjs'
      - '.github/workflows/maestro-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maestro-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax, static links and integration invariants
        run: node tests/maestro-smoke.mjs
      - name: Verify portrait motion and hand gesture
        run: |
          node tests/architect-rig.mjs
          node tests/architect-portrait.mjs
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: none
          coverage: none
      - name: Lint optional Russian-hosted lead receiver
        run: php -l maestro/server/lead-api.php
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium test engine
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify speech lifecycle and cancellation
        run: node tests/maestro-speech.mjs
      - name: Run desktop and mobile browser journeys
        run: node tests/maestro-browser.mjs
      - name: Save visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-browser-screenshots
          path: test-artifacts/maestro/
          if-no-files-found: ignore
          retention-days: 7
  lead-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-database-password
          MYSQL_DATABASE: maestro_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-only-database-password"
          --health-interval=5s
          --health-timeout=4s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql
          tools: none
          coverage: none
      - name: Install database schema
        run: mysql -h 127.0.0.1 -u root -pci-only-database-password maestro_ci < maestro/server/lead_schema.sql
      - name: Verify API consent, storage and rate limits with synthetic data
        env:
          MAESTRO_ALLOWED_ORIGIN: https://m72692591-collab.github.io
          MAESTRO_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=maestro_ci;charset=utf8mb4
          MAESTRO_DB_USER: root
          MAESTRO_DB_PASSWORD: ci-only-database-password
          MAESTRO_ADMIN_TOKEN: maestro-ci-test-admin-token-not-valid-in-production-2026-10
          MAESTRO_IP_PEPPER: ci-only-pepper-string-not-valid-for-real-visitors-20261026
        run: |
          php -S 127.0.0.1:8766 -t maestro/server > /tmp/maestro-php.log 2>&1 &
          node tests/maestro-leads-api.mjs
