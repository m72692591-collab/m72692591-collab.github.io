name: Prepare MAESTRO conductor release
on:
  push:
    branches: [feature/maestro-conductor-20261026]
    paths:
      - 'tools/apply_maestro_release.py'
      - 'tools/finalize_maestro_release.py'
      - 'maestro/assets/maestro-core.js'
      - 'maestro/assets/maestro-motion.*'
      - 'maestro/brand-lab.html'
      - 'tests/maestro-conductor.mjs'
      - '.github/workflows/prepare-maestro-conductor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-maestro-conductor
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feature/maestro-conductor-20261026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maestro-conductor-20261026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated build and browser dependencies
        run: |
          python -m pip install Pillow==11.3.0
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Apply scoped migration and optimize images
        run: |
          python tools/apply_maestro_release.py
          python tools/finalize_maestro_release.py
      - name: Verify actual generated source in desktop and mobile Chromium
        run: |
          node tests/maestro-smoke.mjs
          node tests/maestro-browser.mjs
          node tests/maestro-conductor.mjs
      - name: Save checks, screenshots and gesture recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-conductor-qa
          path: |
            test-artifacts/
            image-optimization.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit verified site changes to feature branch only
        run: |
          git config user.name 'Maestro release builder'
          git config user.email 'maestro-release@users.noreply.github.com'
          git add maestro/ _config.yml image-optimization.json
          if ! git diff --cached --quiet; then
            git commit -m 'feat(maestro): apply tested conductor navigation, context fixes and optimized images'
            git push origin HEAD:feature/maestro-conductor-20261026
          fi
